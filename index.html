:root{color-scheme:dark;--bg:#0d0d14;--pane:#161620;--pane2:#1e1e2a;--line:#30303d;--muted:#a6a5b5;--white:#f7f4fa;--accent:#ff747e;--accent2:#b48bf2;--green:#74d3a3;--radius:16px;--shadow:0 20px 60px #0009}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -25%,#342039 0%,transparent 42%),var(--bg);color:var(--white);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{background:#12121b;color:var(--white);border:1px solid #3d3b4a;border-radius:11px;padding:11px 12px;outline:none;width:100%;min-width:0}input:focus,textarea:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #b48bf222}textarea{resize:vertical;min-height:90px}a{color:#d4b7ff}.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#11111b;border-right:1px solid var(--line);padding:26px 15px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:0 11px 8px;font-weight:800;letter-spacing:-.6px;font-size:21px}.brandmark{display:grid;place-items:center;height:37px;width:37px;background:linear-gradient(135deg,#ff667e,#8d66d9);border-radius:12px;color:#fff;font-size:21px;box-shadow:0 6px 20px #e2547352}.navgroup{font-size:11px;font-weight:800;color:#77768b;letter-spacing:.14em;padding:8px 12px 3px}.navbtn{display:flex;gap:12px;align-items:center;width:100%;padding:11px 13px;background:none;border:0;border-radius:12px;color:#b8b7c4;text-align:left;font-weight:650}.navbtn:hover,.navbtn.active{background:#28212f;color:#fff}.navbtn.active .navico{color:#ff8893}.navico{font-size:20px;width:22px;text-align:center}.sidefoot{margin-top:auto;padding:12px;color:#8e8b9d;font-size:12px;border-top:1px solid var(--line)}.shell{max-width:1250px;width:100%;margin:0 auto;padding:34px 36px 145px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#b6a3d6;text-transform:uppercase}h1{font-size:clamp(26px,4vw,36px);letter-spacing:-1.1px;line-height:1.12;margin:8px 0 7px}p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#252431;color:var(--white);padding:10px 15px;border-radius:12px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(1.14)}.btn.primary{background:linear-gradient(110deg,#fa7180,#a06be2);border-color:transparent;color:#fff}.btn.minor{background:transparent}.btn.danger{color:#ff9eaa;border-color:#714552}.btn.small{padding:7px 10px;font-size:13px}.btn.icon{padding:8px 11px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 16px}.search{flex:1;min-width:180px;position:relative}.search input{padding-left:36px;background:var(--pane)}.search:before{content:'⌕';position:absolute;top:7px;left:12px;font-size:23px;color:#8f8b99}.toolbar select{width:auto;min-width:115px;background:var(--pane)}.pill{display:inline-block;border:1px solid #484455;color:#c4c0d1;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}.pill.accent{color:#ffc1c8;border-color:#7d4c62;background:#5e34442b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{background:linear-gradient(130deg,#20202d,#181820);padding:18px;border-radius:16px;border:1px solid #31303b}.stat strong{display:block;font-size:29px;line-height:1.2}.stat span{color:#a9a6b8;font-size:12px}.callout{display:flex;gap:13px;align-items:flex-start;border:1px solid #5b4a68;background:#251d31;border-radius:14px;padding:13px 15px;color:#d8cbe3;margin:20px 0;font-size:13px}.callout b{color:#fff}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.sectionhead h2{font-size:18px;letter-spacing:-.3px;margin:0}.songlist{display:grid;gap:10px}.song{display:flex;align-items:center;gap:14px;background:var(--pane);border:1px solid var(--line);padding:12px;border-radius:15px;min-width:0}.art{flex:none;width:55px;height:55px;background:linear-gradient(135deg,#f47880,#51407c);border-radius:11px;display:grid;place-items:center;font-size:24px;color:white;border:1px solid #ffffff14}.songmain{min-width:0;flex:1}.songtitle{font-weight:750;font-size:15px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.songmeta{color:#aaa7b8;font-size:12px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.songactions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.kicker{font-size:11px;color:#9995a9;margin-top:5px}.empty{padding:45px 20px;border:1px dashed #555064;border-radius:18px;text-align:center;background:#ffffff05}.empty .symbol{font-size:43px}.empty h3{margin:9px 0;font-size:19px}.empty p{max-width:480px;margin:0 auto 16px}.albumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.album{border:1px solid var(--line);background:var(--pane);border-radius:16px;padding:12px;overflow:hidden;cursor:pointer}.album:hover{border-color:#a676c6}.albumart{width:100%;aspect-ratio:1.3;border-radius:10px;background:linear-gradient(145deg,var(--from,#8c5f93),var(--to,#20213e));display:grid;place-items:center;color:#fff;font-size:54px;text-shadow:0 4px 20px #0005}.album h3{margin:10px 0 2px;font-size:16px}.album p{font-size:12px}.mobile-nav{display:none}.player{position:fixed;left:255px;right:20px;bottom:15px;background:#20202bf5;border:1px solid #555062;border-radius:16px;box-shadow:0 10px 40px #000a;display:none;align-items:center;gap:12px;padding:9px 13px;z-index:20;backdrop-filter:blur(15px)}.player.show{display:flex}.player img{width:40px}.playname{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player audio{max-width:350px;width:42%;height:39px}.shade{position:fixed;inset:0;z-index:40;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.shade.open{display:flex}.modal{width:min(740px,100%);max-height:min(94vh,1000px);background:#191923;border:1px solid #484452;border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.modalhead{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center}.modalhead h2{font-size:21px;margin:0}.modalcontent{padding:21px 24px;overflow-y:auto;overscroll-behavior:contain}.modalfoot{border-top:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:block;min-width:0}.field.full{grid-column:1/-1}.field label,.field .label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#c4c0cf}.field small{display:block;color:#aaa5b7;font-size:11px;margin-top:4px}.inlinebuttons{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:0 0 17px}.tab{background:#262431;color:#bdb7ca;border:1px solid #3b3645;border-radius:99px;padding:8px 16px;font-weight:750}.tab.active{background:#4f344f;border-color:#a86e9f;color:#fff}.draftbox{background:#11111a;border:1px solid #494356;border-radius:12px;padding:12px;white-space:pre-wrap;max-height:160px;overflow:auto;font-size:12px;color:#c2baca}.divider{height:1px;background:var(--line);margin:17px 0}.version{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #34313d;font-size:13px}.version span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.backupgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:18px}.backupitem{border:1px solid #36333f;border-radius:16px;background:#1c1c27;padding:18px}.backupitem h3{margin:0 0 7px}.backupitem p{font-size:13px;margin:0 0 18px}.notification{position:fixed;bottom:105px;right:22px;z-index:60;background:#353040;color:white;padding:12px 16px;border:1px solid #87738a;border-radius:12px;box-shadow:var(--shadow);max-width:370px;display:none}.notification.show{display:block}.hint{font-size:12px;color:#c8bad2;line-height:1.5}.flag{border-radius:100px;background:#3a2a3d;padding:5px 10px;font-size:11px;font-weight:800;color:#ffc1c8}.bulkbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;background:#272030;border:1px solid #624668;border-radius:13px;padding:12px;margin:12px 0}.bulkbar select,.bulkbar input{width:auto;max-width:170px}.checkbox{accent-color:#ff7b90;width:19px;height:19px;flex:none}.advanced{padding:10px 12px;background:#221d2a;border-radius:10px;color:#d6c3e6;font-size:12px;margin:15px 0}.subtle{color:var(--muted);font-size:13px}.smallprint{font-size:11px;color:#908ca0;margin-top:8px}button:focus-visible{outline:3px solid #bba1ff;outline-offset:2px} @media(max-width:820px){.app{display:block}.sidebar{display:none}.shell{padding:24px 17px 180px}.top{align-items:center}.top .btn{padding:10px 12px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#15141ff7;border-top:1px solid #393442;display:flex;justify-content:space-around;padding:9px 4px max(12px,env(safe-area-inset-bottom));backdrop-filter:blur(20px)}.mobile-nav button{border:0;background:transparent;color:#aaa5b8;font-size:11px;font-weight:750;min-width:56px;display:grid;justify-items:center;gap:2px}.mobile-nav button.active{color:#ffa0a6}.mobile-nav b{font-size:20px;font-weight:500}.player{left:12px;right:12px;bottom:74px;flex-wrap:wrap}.player audio{width:100%;max-width:none}.notification{bottom:169px;right:13px;left:13px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.modal{max-height:93dvh}.modalcontent{padding:17px}.modalhead{padding:15px 18px}.modalfoot{padding:11px 16px}.songactions .hide-mobile{display:none}}@media(max-width:520px){.fields,.backupgrid{grid-template-columns:1fr}.song{gap:9px;padding:10px}.art{width:47px;height:47px}.songactions{gap:4px}.songactions .btn{padding:7px;font-size:12px}.stat span{font-size:11px}.top{gap:6px}.toolbar{gap:8px}.toolbar .search{flex-basis:100%}.toolbar select{flex:1;min-width:0}.modalfoot .btn{flex:1}.albumgrid{grid-template-columns:repeat(2,1fr)}.albumart{font-size:38px}.bulkbar select,.bulkbar input{max-width:100%;flex:1}}
.install-panel{background:linear-gradient(120deg,#25202f,#181925);border:1px solid #5c4b6e;border-radius:15px;padding:16px;margin:14px 0}.install-panel h3{margin:0 0 6px;font-size:17px}.install-panel p{font-size:13px;margin-bottom:12px}.install-panel .install-guide{font-size:12px;color:#c7bdcf;line-height:1.65;margin:10px 0 0}.install-panel .inlinebuttons{align-items:center}.tiny-status{font-size:12px;color:#a8a1b4}.tiny-status strong{color:#d9c9ed}.update-toast{display:none;position:fixed;right:15px;top:15px;z-index:70;background:#211d2b;border:1px solid #785d89;border-radius:12px;padding:12px;box-shadow:0 10px 20px #0006;max-width:330px}.update-toast.show{display:block}.update-toast p{font-size:12px;margin:0 0 8px}.update-toast .inlinebuttons{justify-content:flex-end}@media(max-width:820px){.install-panel{padding:14px}.top .inlinebuttons{justify-content:flex-end}.top .inlinebuttons .btn{font-size:12px}.update-toast{left:13px;right:13px}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">♫</div>SongVault <span style="font-size:11px;align-self:end;color:#a895b6">STUDIO</span></div><div class="navgroup">YOUR WORKSPACE</div><nav id="desktopNav"></nav><div class="navgroup">QUICK ACCESS</div><button class="navbtn" data-action="sample">✦ &nbsp;Add Neon Heartbeat draft</button><div class="sidefoot">Private, local-first library.<br>No Suno account connected.<br><br><span id="storeStatus">Preparing storage…</span></div></aside><main class="shell" id="content"></main></div>
<nav id="mobileNav" class="mobile-nav"></nav>
<div id="player" class="player"><div class="art" style="width:40px;height:40px;font-size:19px">♫</div><span class="playname" id="playingTitle">Song</span><audio id="audioPlayer" controls preload="none"></audio><button class="btn small" data-action="stop-audio">✕</button></div>
<div id="shade" class="shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Edit</h2><button class="btn icon minor" data-action="close-modal" aria-label="Close">✕</button></div><div class="modalcontent" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></section></div>
<div class="notification" id="toast" role="status" aria-live="polite"></div>
<div id="updateToast" class="update-toast" role="status"><p>A new version of SongVault Studio is ready. Your saved library will be preserved.</p><div class="inlinebuttons"><button class="btn small" data-action="later-update">Later</button><button class="btn small primary" data-action="apply-update">Update app</button></div></div>
<noscript><div style="padding:24px;color:white">SongVault Studio requires JavaScript.</div></noscript>
<input type="file" id="importAudio" multiple accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac" hidden>
<input type="file" id="importBackup" accept=".zip,application/zip,.json,application/json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const APP_VERSION='6.0';
let deferredInstallPrompt=null;
let waitingWorker=null;
function isStandalone(){return matchMedia('(display-mode: standalone)').matches || !!navigator.standalone}
function installPanel(){return `<section class="install-panel"><h3>📱 Install SongVault Studio</h3><p>Open your hosted SongVault website in Chrome on Android, then install it like an app. Your library still stays on this device only.</p><div class="inlinebuttons"><button class="btn primary" data-action="install-app">${isStandalone()?'✓ Already installed':'↗ Install / instructions'}</button><span class="tiny-status" id="connectionStatus">${navigator.onLine?'● Online':'● Offline-ready'}</span></div><div class="install-guide">Android Chrome: menu <b>⋮ → Install app</b> or <b>Add to Home screen</b>. On Windows: Chrome/Edge address bar → Install icon or browser menu → Install. Requires HTTPS hosting. App works offline after first online load. New songs and imported audio remain private in this browser, not on GitHub.</div></section>`}
async function updateStorageUsage(){const el=document.getElementById('storageUsage');if(!el)return;try{if(navigator.storage?.estimate){const e=await navigator.storage.estimate();const unit=v=>v>1024*1024*1024?(v/1024**3).toFixed(1)+' GB':(v/1024**2).toFixed(1)+' MB';el.textContent=`Approx. ${unit(e.usage||0)} used of ${unit(e.quota||0)} browser quota (all site data).`;}else el.textContent='Storage estimate not available on this browser.'}catch{el.textContent='Storage estimate unavailable.'}}
const GENRES=['Electronic','Pop','Rock','Metal','Hip-Hop','R&B / Soul','Cinematic','Orchestral','Jazz','Blues','Country','Folk','Latin','K-Pop','Ambient','Classical','Other'];
const genreOptions=(selected='',allowBlank=true)=>`${allowBlank?'<option value="">Not set</option>':''}${GENRES.map(g=>`<option ${g===selected?'selected':''} value="${escapeHTML(g)}">${escapeHTML(g)}</option>`).join('')}`;
const state={db:null,songs:[],albums:[],playlists:[],view:'library',filterGenre:'',filterSubgenre:'',filterAlbum:'',search:'',sort:'recent',bulk:false,selected:new Set(),editId:null,modalKind:'song',playerURL:null,toastTimer:null};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove('show'),4000)}
function idb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('songvault-studio-v1',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ['songs','albums','audio','playlists'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function storeGetAll(name){return new Promise((res,rej)=>{const r=state.db.transaction(name,'readonly').objectStore(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function storeGet(name,id){return new Promise((res,rej)=>{const r=state.db.transaction(name,'readonly').objectStore(name).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function storePut(name,value){return new Promise((res,rej)=>{const r=state.db.transaction(name,'readwrite').objectStore(name).put(value);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function storeDelete(name,id){return new Promise((res,rej)=>{const r=state.db.transaction(name,'readwrite').objectStore(name).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function load(){state.songs=await storeGetAll('songs');state.albums=await storeGetAll('albums');state.playlists=await storeGetAll('playlists');render()}
function albumName(id){return state.albums.find(a=>a.id===id)?.title||'Single / Unassigned'}
function icon(kind){return kind==='speech'?'🎙':'♫'}
function countAudio(){return state.songs.reduce((n,s)=>n+s.versions.filter(v=>v.fileName).length,0)}
function renderNav(){const links=[['library','♫','Library'],['genres','♧','Genres'],['albums','▦','Albums'],['create','＋','Create'],['backup','⇩','Backup']];$('#desktopNav').innerHTML=links.map(([id,ic,t])=>`<button class="navbtn ${state.view===id?'active':''}" data-action="view" data-view="${id}"><span class="navico">${ic}</span>${t}</button>`).join('');$('#mobileNav').innerHTML=links.map(([id,ic,t])=>`<button class="${state.view===id?'active':''}" data-action="view" data-view="${id}"><b>${ic}</b>${t}</button>`).join('')}
function head(kicker,title,desc,button=''){return `<div class="top"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function render(){renderNav();const el=$('#content');if(state.view==='library')el.innerHTML=libraryView();if(state.view==='albums')el.innerHTML=albumsView();if(state.view==='genres')el.innerHTML=genresView();if(state.view==='create')el.innerHTML=createView();if(state.view==='backup')el.innerHTML=backupView();if(state.view==='backup')updateStorageUsage();$('#storeStatus').textContent=`${state.songs.length} songs · ${state.albums.length} albums · v${APP_VERSION}`} 
function matchingSongs(){let s=[...state.songs];if(state.filterGenre)s=s.filter(x=>state.filterGenre==='__none__'?!x.genre:x.genre===state.filterGenre);if(state.filterSubgenre)s=s.filter(x=>state.filterSubgenre==='__none__'?!x.subgenre:x.subgenre===state.filterSubgenre);if(state.filterAlbum)s=s.filter(x=>x.albumId===state.filterAlbum);if(state.search){const q=state.search.toLowerCase();s=s.filter(x=>[x.title,x.artist,x.genre,x.subgenre,x.mood,albumName(x.albumId),x.style].join(' ').toLowerCase().includes(q))}s.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title):state.sort==='oldest'?a.createdAt.localeCompare(b.createdAt):b.updatedAt.localeCompare(a.updatedAt));return s}
function libraryView(){const filtered=matchingSongs();return `${head('MY STUDIO','Your music library','Organize tracks, drafts, genres, subgenres and versions.',`<div class="inlinebuttons"><button class="btn minor" data-action="install-app">↗ Install</button><button class="btn primary" data-action="new-song">＋ New song</button></div>`)}<div class="stats"><div class="stat"><strong>${state.songs.length}</strong><span>Tracks & drafts</span></div><div class="stat"><strong>${state.albums.length}</strong><span>Albums</span></div><div class="stat"><strong>${countAudio()}</strong><span>Audio versions</span></div></div><div class="callout"><span>🔒</span><div><b>Offline-first mode.</b> Your files and song details stay in this browser's storage. Suno isn't connected. Back up your library regularly, especially before clearing browser data or switching devices.</div></div><div class="toolbar"><div class="search"><input id="query" aria-label="Search songs" placeholder="Search songs, subgenres, albums…" value="${escapeHTML(state.search)}"></div><select id="genreFilter" aria-label="Filter genre"><option value="">All genres</option><option value="__none__" ${state.filterGenre==='__none__'?'selected':''}>Uncategorized</option>${genreOptions(state.filterGenre,false)}</select><select id="subgenreFilter" aria-label="Filter subgenre"><option value="">All subgenres</option><option value="__none__" ${state.filterSubgenre==='__none__'?'selected':''}>Uncategorized</option>${[...new Set(state.songs.filter(s=>!state.filterGenre||(state.filterGenre==='__none__'?!s.genre:s.genre===state.filterGenre)).map(s=>s.subgenre).filter(Boolean))].sort().map(g=>`<option value="${escapeHTML(g)}" ${state.filterSubgenre===g?'selected':''}>${escapeHTML(g)}</option>`).join('')}</select><select id="albumFilter" aria-label="Filter album"><option value="">All albums</option>${state.albums.map(a=>`<option value="${a.id}" ${state.filterAlbum===a.id?'selected':''}>${escapeHTML(a.title)}</option>`).join('')}</select><select id="sortFilter" aria-label="Sort"><option value="recent" ${state.sort==='recent'?'selected':''}>Newest</option><option value="title" ${state.sort==='title'?'selected':''}>Title A–Z</option><option value="oldest" ${state.sort==='oldest'?'selected':''}>Oldest</option></select></div><div class="sectionhead"><h2>${filtered.length} ${filtered.length===1?'song':'songs'}</h2><div class="inlinebuttons"><button class="btn small minor" data-action="import-audio">↑ Import audio</button><button class="btn small minor" data-action="toggle-bulk">${state.bulk?'Done selecting':'Select multiple'}</button></div></div>${state.bulk?bulkBar():''}<div class="songlist">${filtered.length?filtered.map(songCard).join(''):`<div class="empty"><div class="symbol">🎼</div><h3>${state.songs.length?'No matches found':'Start your music library'}</h3><p>${state.songs.length?'Try another search or filter.':'Add a song draft, import downloaded audio files, or load the Neon Heartbeat example.'}</p><div class="inlinebuttons" style="justify-content:center"><button class="btn primary" data-action="new-song">＋ Create draft</button><button class="btn" data-action="import-audio">Import music files</button>${!state.songs.length?'<button class="btn" data-action="sample">Example draft</button>':''}</div></div>`}</div>`}
function songCard(s){const tag=[s.genre,s.subgenre,albumName(s.albumId)==='Single / Unassigned'?'':albumName(s.albumId)].filter(Boolean).join(' · ');const v=s.versions.find(v=>v.id===s.activeVersionId);return `<article class="song">${state.bulk?`<input class="checkbox" aria-label="Select ${escapeHTML(s.title)}" type="checkbox" data-action="select-song" data-id="${s.id}" ${state.selected.has(s.id)?'checked':''}>`:''}<div class="art">${icon(s.kind)}</div><div class="songmain"><div class="songtitle">${escapeHTML(s.title||'Untitled')}</div><div class="songmeta">${escapeHTML(s.artist||'Unknown artist')} · ${escapeHTML(tag||'Uncategorized')}</div><div class="kicker">${s.kind==='speech'?'Speech':'Song'} · ${s.versions.length} ${s.versions.length===1?'version':'versions'} ${v?.fileName?'· Audio attached':'· No audio yet'} · <span class="pill ${s.status==='draft'?'accent':''}">${escapeHTML(s.status)}</span></div></div><div class="songactions">${v?.fileName?`<button class="btn small" data-action="play" data-id="${s.id}" aria-label="Play">▶</button>`:''}<button class="btn small hide-mobile" data-action="copy-prompt" data-id="${s.id}">Copy prompt</button><button class="btn small" data-action="edit-song" data-id="${s.id}">Edit</button></div></article>`}
function bulkBar(){return `<div class="bulkbar"><b style="font-size:12px">${state.selected.size} selected</b><select id="bulkGenre"><option value="">Genre unchanged</option>${genreOptions('',false)}</select><input id="bulkSubgenre" placeholder="Set subgenre (optional)"><select id="bulkAlbum"><option value="">Album unchanged</option><option value="__none">Remove album</option>${state.albums.map(a=>`<option value="${a.id}">${escapeHTML(a.title)}</option>`).join('')}</select><button class="btn primary small" data-action="apply-bulk">Apply changes</button></div>`}
function albumsView(){return `${head('COLLECTIONS','Albums & collections','Build collections for any genre, mood or release.',`<button class="btn primary" data-action="new-album">＋ New album</button>`)}<div class="albumgrid">${state.albums.map(a=>{const n=state.songs.filter(s=>s.albumId===a.id).length;return `<div class="album" data-action="open-album" data-id="${a.id}"><div class="albumart" style="--from:${escapeHTML(a.color||'#8558a8')}">◉</div><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML([a.genre,a.subgenre].filter(Boolean).join(' · ')||'No genre')} · ${n} ${n===1?'track':'tracks'}</p><button class="btn small" data-action="edit-album" data-id="${a.id}" style="margin-top:10px">Edit details</button></div>`}).join('')}${!state.albums.length?`<div class="empty"><div class="symbol">▦</div><h3>No albums yet</h3><p>Create an album, then assign songs to it from the song editor or bulk organizer.</p><button class="btn primary" data-action="new-album">Create album</button></div>`:''}</div>`}
function genresView(){const genres=[...new Set(state.songs.map(x=>x.genre||'Uncategorized'))].sort();return `${head('BROWSE COLLECTION','Genre folders','Your music grouped automatically by genre and subgenre.',`<button class="btn primary" data-action="import-audio">↑ Import audio</button>`)}${genres.length?`<div class="albumgrid">${genres.map(g=>{const songs=state.songs.filter(s=>(s.genre||'Uncategorized')===g),subs=[...new Set(songs.map(s=>s.subgenre||'Uncategorized'))].sort();return `<div class="album" style="cursor:default"><div class="albumart" style="aspect-ratio:2.4;font-size:34px">♬</div><h3>${escapeHTML(g)}</h3><p>${songs.length} ${songs.length===1?'track':'tracks'} · ${subs.length} subgenres</p><button class="btn small" style="margin:10px 0;width:100%" data-action="open-genre" data-genre="${escapeHTML(g==='Uncategorized'?'__none__':g)}">View all ${escapeHTML(g)}</button><div class="divider" style="margin:6px 0"></div>${subs.map(sub=>`<button class="navbtn" style="font-size:12px;padding:7px 4px" data-action="open-subgenre" data-genre="${escapeHTML(g==='Uncategorized'?'__none__':g)}" data-subgenre="${escapeHTML(sub==='Uncategorized'?'__none__':sub)}">📁 ${escapeHTML(sub)} <span style="margin-left:auto;color:#999">${songs.filter(s=>(s.subgenre||'Uncategorized')===sub).length}</span></button>`).join('')}</div>`}).join('')}</div>`:`<div class="empty"><div class="symbol">📁</div><h3>No genre folders yet</h3><p>Imported songs and drafts appear here as you assign genres and subgenres.</p><button class="btn primary" data-action="new-song">Add a track</button></div>`}`}
function createView(){return `${head('SONG WORKBENCH','Create & prepare','Prepare requests for Suno using the fields shown in your screenshots.',`<button class="btn primary" data-action="new-song">＋ New draft</button>`)}<div class="callout"><span>🎛</span><div><b>Suno-ready, not Suno-connected.</b> Draft a Song with lyrics, styles and voice, or Speech with script and tone. Copy the fields into Suno manually until official API access is available.</div></div><div class="backupgrid"><div class="backupitem"><h3>♫ Song</h3><p>Lyrics, styles, voice, reference audio notes, and your preferred model label (such as v6).</p><button class="btn primary" data-action="new-song">Make song draft</button></div><div class="backupitem"><h3>🎙 Speech</h3><p>Script, tone, and backing-music direction for narration or voiceover content.</p><button class="btn" data-action="new-speech">Make speech draft</button></div></div><div class="sectionhead"><h2>Recent drafts</h2></div><div class="songlist">${[...state.songs].filter(s=>s.status==='draft').sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,6).map(songCard).join('')||'<p>No drafts yet.</p>'}</div><div class="advanced"><b>Creating in Suno:</b> Use <a href="https://suno.com" target="_blank" rel="noopener noreferrer">suno.com</a> and copy the relevant fields from your saved draft. We are not automatically logging in, generating songs, or scraping your account.</div>`}
function backupView(){return `${head('KEEP YOUR WORK','Backups & portability','Preserve your library before changing devices or clearing browser data.') }${installPanel()}<div class="callout"><span>📦</span><div><b>Your library belongs to this browser profile.</b> A complete ZIP backup includes song metadata, album organization, lyrics, drafts, and any locally imported audio files. A metadata-only JSON export excludes the audio files.</div></div><div class="install-panel"><h3>🔒 Device storage</h3><p id="storageUsage">Checking browser storage…</p><button class="btn small" data-action="protect-storage">Request persistent storage</button><div class="install-guide">Browser storage can still be lost if app/browser data is cleared, on some device cleanups, or if the site address changes. Always download full ZIP backups and keep copies elsewhere.</div></div><div class="backupgrid"><div class="backupitem"><h3>Export complete ZIP</h3><p>Includes songs, album details and locally stored audio versions. Best option when moving devices or making a safe backup.</p><button class="btn primary" data-action="export-zip">⇩ Download full backup</button></div><div class="backupitem"><h3>Restore a backup</h3><p>Import a SongVault-generated ZIP or JSON. Matching tracks will be updated; other existing tracks are kept.</p><button class="btn" data-action="import-backup">↑ Restore from file</button></div><div class="backupitem"><h3>Export catalog JSON</h3><p>Small, text-based backup of metadata only. Does <b>not</b> include audio files.</p><button class="btn" data-action="export-json">⇩ Metadata only</button></div><div class="backupitem"><h3>Bulk import audio</h3><p>Add downloaded music files from your device. Each becomes a new track; then sort them into genres and albums.</p><button class="btn" data-action="import-audio">↑ Select audio files</button></div></div><div class="advanced"><b>Privacy & limitations:</b> No cloud account, Suno connection, tracking or background upload. Browser storage can be removed when app/site data is cleared. Use the same site address consistently; opening local files on Android may not preserve data reliably. For ongoing mobile use, host this static app on a stable HTTPS origin.</div>`}
function modal(title,body,foot){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#shade').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#shade').classList.remove('open');document.body.style.overflow='';state.editId=null}
function songEditor(id=null,kind='song'){let s=id?state.songs.find(x=>x.id===id):null;state.editId=id;state.modalKind=s?.kind||kind;const v=s?.versions||[];let isSpeech=state.modalKind==='speech';modal(s?'Edit '+s.title:isSpeech?'New speech draft':'New song draft',`<form id="songForm"><div class="tabs"><button type="button" class="tab ${!isSpeech?'active':''}" data-action="modal-kind" data-kind="song">♫ Song</button><button type="button" class="tab ${isSpeech?'active':''}" data-action="modal-kind" data-kind="speech">🎙 Speech</button></div><div class="fields"><div class="field"><label for="fTitle">Title *</label><input id="fTitle" required maxlength="150" value="${escapeHTML(s?.title||'')}" placeholder="e.g. Neon Heartbeat"></div><div class="field"><label for="fArtist">Artist / project</label><input id="fArtist" value="${escapeHTML(s?.artist||'')}" placeholder="Your artist name"></div><div class="field"><label for="fGenre">Genre</label><select id="fGenre">${genreOptions(s?.genre||'')}</select></div><div class="field"><label for="fSubgenre">Subgenre</label><input id="fSubgenre" value="${escapeHTML(s?.subgenre||'')}" placeholder="Synth-pop, darkwave…"></div><div class="field"><label for="fAlbum">Album / collection</label><select id="fAlbum"><option value="">Single / Unassigned</option>${state.albums.map(a=>`<option value="${a.id}" ${s?.albumId===a.id?'selected':''}>${escapeHTML(a.title)}</option>`).join('')}</select></div><div class="field"><label for="fStatus">Status</label><select id="fStatus"><option value="draft" ${s?.status!=='finished'?'selected':''}>Draft</option><option value="finished" ${s?.status==='finished'?'selected':''}>Finished</option></select></div><div class="field full"><label for="fMood">Mood / tags</label><input id="fMood" value="${escapeHTML(s?.mood||'')}" placeholder="Energetic, nostalgic, nighttime…"></div>${isSpeech?`<div class="field full"><label for="fScript">Script</label><textarea id="fScript" rows="7" placeholder="Narration / voiceover script…">${escapeHTML(s?.script||'')}</textarea></div><div class="field full"><label for="fTone">Tone</label><input id="fTone" value="${escapeHTML(s?.tone||'')}" placeholder="Calm, cinematic, suspenseful…"></div><div class="field full"><label for="fBacking">Backing music direction</label><textarea id="fBacking" rows="3" placeholder="Ambient pads, subtle piano, no percussion…">${escapeHTML(s?.backingMusic||'')}</textarea></div>`:`<div class="field full"><label for="fLyrics">Lyrics (Suno Lyrics)</label><textarea id="fLyrics" rows="9" placeholder="[Verse 1]&#10;…&#10;[Chorus]&#10;…">${escapeHTML(s?.lyrics||'')}</textarea></div><div class="field full"><label for="fStyle">Styles / production description</label><textarea id="fStyle" rows="4" placeholder="Synth-pop, 128 BPM, drum machine, layered synthesizers…">${escapeHTML(s?.style||'')}</textarea></div><div class="field full"><label for="fVoice">Voice direction</label><input id="fVoice" value="${escapeHTML(s?.voice||'')}" placeholder="Powerful male lead, airy female vocal…"></div><div class="field"><label for="fModel">Suno model label</label><input id="fModel" value="${escapeHTML(s?.model||'v6')}" placeholder="v6"></div><div class="field"><label>Connection</label><input value="Manual copy only" disabled><small>Developer API not authorized yet</small></div><div class="field full"><label for="fAudioNotes">Audio reference notes</label><textarea id="fAudioNotes" rows="2" placeholder="Describe any reference audio you intend to add inside Suno…">${escapeHTML(s?.audioNotes||'')}</textarea></div>`}<div class="field full"><label for="fNotes">Private notes</label><textarea id="fNotes" rows="2" placeholder="Arrangement ideas, revisions, reminders…">${escapeHTML(s?.notes||'')}</textarea></div></div></form>${s?`<div class="divider"></div><div class="sectionhead"><h2>Audio versions (${v.length})</h2><button class="btn small" data-action="upload-version" data-id="${s.id}">＋ Add audio version</button></div>${v.map(x=>`<div class="version"><span>🎵 ${escapeHTML(x.label||'Version')} ${x.fileName?'— '+escapeHTML(x.fileName):'(no audio)'}</span>${x.fileName?`<button class="btn small" data-action="play-version" data-id="${s.id}" data-version="${x.id}">▶</button>`:''}<button class="btn small ${s.activeVersionId===x.id?'primary':''}" data-action="activate-version" data-id="${s.id}" data-version="${x.id}">Active</button><button class="btn small danger" data-action="delete-version" data-id="${s.id}" data-version="${x.id}" aria-label="Remove version">✕</button></div>`).join('')||'<p class="subtle">No versions yet. Attach an audio file after saving.</p>'}<div class="divider"></div><div class="inlinebuttons"><button class="btn small" data-action="copy-prompt" data-id="${s.id}">Copy full creation prompt</button><button class="btn small danger" data-action="delete-song" data-id="${s.id}">Delete song</button></div>`:''}`,`<button class="btn minor" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-song">${s?'Save changes':'Save draft'}</button>`);$('#fTitle').focus()}
function fieldsFromEditor(){const get=k=>$('#'+k)?.value?.trim()||'';return {title:get('fTitle'),artist:get('fArtist'),genre:get('fGenre'),subgenre:get('fSubgenre'),albumId:get('fAlbum'),status:get('fStatus'),mood:get('fMood'),lyrics:get('fLyrics'),style:get('fStyle'),voice:get('fVoice'),model:get('fModel'),audioNotes:get('fAudioNotes'),script:get('fScript'),tone:get('fTone'),backingMusic:get('fBacking'),notes:get('fNotes'),kind:state.modalKind}}
async function saveSong(){let data=fieldsFromEditor();if(!data.title){$('#fTitle').focus();toast('A title is required.');return}const old=state.editId?state.songs.find(s=>s.id===state.editId):null;const song={...(!old?{id:uuid(),createdAt:now(),versions:[],activeVersionId:''}:old),...data,updatedAt:now()};await storePut('songs',song);closeModal();await load();toast(old?'Song updated.':'Draft saved locally.')}
function albumEditor(id=null){let a=state.albums.find(x=>x.id===id);state.editId=id;modal(a?'Edit album':'New album',`<div class="fields"><div class="field full"><label for="aTitle">Album title *</label><input id="aTitle" maxlength="150" value="${escapeHTML(a?.title||'')}" placeholder="Neon Nights"></div><div class="field"><label for="aGenre">Primary genre</label><select id="aGenre">${genreOptions(a?.genre||'')}</select></div><div class="field"><label for="aSubgenre">Subgenre</label><input id="aSubgenre" value="${escapeHTML(a?.subgenre||'')}" placeholder="Synth-pop"></div><div class="field"><label for="aYear">Year</label><input id="aYear" type="number" min="1900" max="2200" value="${escapeHTML(a?.year||new Date().getFullYear())}"></div><div class="field"><label for="aColor">Cover accent color</label><input id="aColor" type="color" value="${escapeHTML(a?.color||'#8558a8')}" style="height:45px;padding:5px"></div><div class="field full"><label for="aDescription">Album description</label><textarea id="aDescription">${escapeHTML(a?.description||'')}</textarea></div></div>${a?`<div class="advanced">${state.songs.filter(s=>s.albumId===a.id).length} tracks are currently assigned to this album.</div>`:''}`,`<button class="btn minor" data-action="close-modal">Cancel</button>${a?`<button class="btn danger" data-action="delete-album" data-id="${a.id}">Delete</button>`:''}<button class="btn primary" data-action="save-album">Save album</button>`);$('#aTitle').focus()}
async function saveAlbum(){const title=$('#aTitle').value.trim();if(!title){toast('Album title required');return}const old=state.editId?state.albums.find(a=>a.id===state.editId):null;const a={...(!old?{id:uuid(),createdAt:now()}:old),title,genre:$('#aGenre').value,subgenre:$('#aSubgenre').value.trim(),year:$('#aYear').value,color:$('#aColor').value,description:$('#aDescription').value.trim(),updatedAt:now()};await storePut('albums',a);closeModal();await load();toast('Album saved.')}
function promptFor(s){if(s.kind==='speech')return `TITLE: ${s.title}\nTYPE: Speech\nSCRIPT:\n${s.script||'(No script entered)'}\n\nTONE: ${s.tone||'Not specified'}\nBACKING MUSIC: ${s.backingMusic||'Not specified'}`;return `TITLE: ${s.title}\nTYPE: Song\nGENRE: ${[s.genre,s.subgenre].filter(Boolean).join(' / ')||'Not specified'}\nMOOD: ${s.mood||'Not specified'}\nMODEL LABEL: ${s.model||'Not specified'}\nSTYLE / MUSIC DESCRIPTION:\n${s.style||'(Not specified)'}\n\nVOICE:\n${s.voice||'Not specified'}\n\nLYRICS:\n${s.lyrics||'(No lyrics entered)'}\n\nAUDIO REFERENCE NOTES:\n${s.audioNotes||'None'}`}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.top='-2000px';document.body.appendChild(ta);ta.select();if(!document.execCommand('copy'))throw Error('Clipboard not available');ta.remove()}toast('Copied. Paste into the relevant Suno fields.')}catch{modal('Copy manually',`<div class="field"><label>Long-press / select all to copy</label><textarea id="manualCopy" rows="12" readonly>${escapeHTML(t)}</textarea></div>`,`<button class="btn primary" data-action="close-modal">Done</button>`);$('#manualCopy').focus();$('#manualCopy').select()}}
async function importAudio(files){let n=0;for(const f of files){if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|flac|ogg|aac)$/i.test(f.name))continue;const id=uuid(),v={id:uuid(),label:'Original import',fileName:f.name,type:f.type||'application/octet-stream',addedAt:now()};const song={id,title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim()||'Imported track',artist:'',genre:'',subgenre:'',albumId:'',status:'finished',kind:'song',mood:'',lyrics:'',style:'',voice:'',audioNotes:'',script:'',tone:'',backingMusic:'',notes:'',versions:[v],activeVersionId:v.id,createdAt:now(),updatedAt:now()};await storePut('audio',{id:v.id,blob:f});await storePut('songs',song);n++}await load();toast(n?`${n} audio file${n!==1?'s':''} imported.`:'No supported audio files selected.')}
async function addVersion(id,file){const song=state.songs.find(s=>s.id===id);if(!song||!file)return;const v={id:uuid(),label:`Version ${song.versions.length+1}`,fileName:file.name,type:file.type||'application/octet-stream',addedAt:now()};await storePut('audio',{id:v.id,blob:file});song.versions.push(v);song.activeVersionId=v.id;song.updatedAt=now();await storePut('songs',song);closeModal();await load();songEditor(id);toast('Audio version attached.')}
async function playSong(id,vid=null){const song=state.songs.find(x=>x.id===id);if(!song)return;const v=song.versions.find(x=>x.id===(vid||song.activeVersionId));if(!v?.fileName)return toast('No audio attached to this version.');const item=await storeGet('audio',v.id);if(!item?.blob)return toast('Audio not found in this browser. Restore a complete backup.');const a=$('#audioPlayer');a.pause();if(state.playerURL)URL.revokeObjectURL(state.playerURL);state.playerURL=URL.createObjectURL(item.blob);a.src=state.playerURL;$('#playingTitle').textContent=`${song.title} · ${v.label}`;$('#player').classList.add('show');try{await a.play()}catch{toast('Press play in the audio player to begin.')}}
function stopAudio(){const a=$('#audioPlayer');a.pause();a.removeAttribute('src');a.load();$('#player').classList.remove('show');if(state.playerURL)URL.revokeObjectURL(state.playerURL);state.playerURL=null}
async function delSong(id){const s=state.songs.find(x=>x.id===id);if(!s||!confirm(`Delete “${s.title}” and its locally stored audio versions? This cannot be undone unless you have a backup.`))return;for(const v of s.versions)await storeDelete('audio',v.id);await storeDelete('songs',id);closeModal();await load();toast('Song deleted.')}
async function delAlbum(id){const a=state.albums.find(x=>x.id===id);if(!a||!confirm(`Delete album “${a.title}”? Its songs will stay in your library as unassigned singles.`))return;for(const s of state.songs.filter(x=>x.albumId===id)){s.albumId='';await storePut('songs',s)}await storeDelete('albums',id);closeModal();state.filterAlbum='';await load();toast('Album deleted; songs retained.')}
async function delVersion(id,vid){let s=state.songs.find(x=>x.id===id);if(!s||!confirm('Remove this audio version?'))return;const v=s.versions.find(x=>x.id===vid);s.versions=s.versions.filter(x=>x.id!==vid);if(s.activeVersionId===vid)s.activeVersionId=s.versions[0]?.id||'';if(v?.fileName)await storeDelete('audio',vid);s.updatedAt=now();await storePut('songs',s);closeModal();await load();songEditor(id)}
async function applyBulk(){const ids=[...state.selected];if(!ids.length)return toast('Select at least one song.');const genre=$('#bulkGenre').value,sub=$('#bulkSubgenre').value.trim(),album=$('#bulkAlbum').value;if(!genre&&!sub&&!album)return toast('Choose at least one change.');for(const id of ids){const s=state.songs.find(x=>x.id===id);if(!s)continue;if(genre)s.genre=genre;if(sub)s.subgenre=sub;if(album)s.albumId=album==='__none'?'':album;s.updatedAt=now();await storePut('songs',s)}state.selected.clear();state.bulk=false;await load();toast(`${ids.length} songs updated.`)}
async function addSample(){if(state.songs.some(s=>s.title==='Neon Heartbeat'))return toast('Neon Heartbeat is already in your library.');const s={id:uuid(),title:'Neon Heartbeat',artist:'',kind:'song',genre:'Electronic',subgenre:'Synth-pop',albumId:'',mood:'Energetic, futuristic, nighttime',status:'draft',style:'Energetic electronic synth-pop, 128 BPM, futuristic cyberpunk atmosphere, powerful male vocals, driving drum machine, deep pulsating synth bass, bright arpeggiated synthesizers, atmospheric verses, explosive melodic chorus, cinematic builds and polished modern production.',voice:'Powerful melodic male lead, controlled low verses, soaring chorus',model:'v6',audioNotes:'',lyrics:`[Intro]\nOh-oh, oh-oh\nFeel the current rising\nOh-oh, oh-oh\nNo more hiding\n\n[Verse 1]\nCity lights are flashing red,\nA thousand voices in my head.\nRunning through the midnight rain,\nLike electricity inside my veins.\n\n[Pre-Chorus]\nTurn it up, let the speakers blow,\nFeel the rush, let the whole world know.\nOne more spark and the sky ignites,\nWe're coming alive tonight!\n\n[Chorus]\nWe are the neon heartbeat!\nBurning through the dark!\nDancing on the edge of lightning,\nRunning like a spark!\n\nWe are the neon heartbeat!\nNever slowing down!\nEven when the lights go out,\nWe'll shake this whole town!\n\n[Instrumental Drop]\n[Heavy synth bass, bright arpeggios, driving drums]\n\n[Verse 2]\nBroken clocks and speeding cars,\nChasing dreams beneath the stars.\nNo more waiting for a sign,\nThis electric world's already mine.\n\n[Pre-Chorus]\nTurn it up, let the speakers blow,\nFeel the rush, let the whole world know.\nOne more spark and the sky ignites,\nWe're coming alive tonight!\n\n[Chorus]\nWe are the neon heartbeat!\nBurning through the dark!\nDancing on the edge of lightning,\nRunning like a spark!\n\n[Bridge]\nWhen the city falls asleep,\nThere's a promise we can keep.\nWhen the silence gets too loud,\nWe'll be the thunder in the clouds.\n\n[Final Chorus]\nWe are the neon heartbeat!\nBurning through the dark!\nDancing on the edge of lightning,\nRunning like a spark!\n\n[Outro]\nOh-oh-oh, neon heartbeat…`,script:'',tone:'',backingMusic:'',notes:'Example based on our earlier song concept. Edit freely.',versions:[],activeVersionId:'',createdAt:now(),updatedAt:now()};await storePut('songs',s);state.view='library';await load();songEditor(s.id);toast('Example draft added.')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),20000)}
const encoder=new TextEncoder(),decoder=new TextDecoder();const crcTable=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);crcTable[i]=c>>>0}
async function crcBlob(blob){let c=0xffffffff;for(let p=0;p<blob.size;p+=2097152){const a=new Uint8Array(await blob.slice(p,p+2097152).arrayBuffer());for(let j=0;j<a.length;j++)c=crcTable[(c^a[j])&255]^(c>>>8)}return (c^0xffffffff)>>>0}
const w16=(v,n,x)=>v.setUint16(n,x,true),w32=(v,n,x)=>v.setUint32(n,x>>>0,true);
async function buildZip(files){let parts=[],central=[],offset=0,centralSize=0;for(const file of files){let b=file.blob,n=encoder.encode(file.name),crc=await crcBlob(b),size=b.size;if(size>0xffffffff)throw Error('An audio file exceeds the ZIP 4 GB limit.');const lh=new Uint8Array(30+n.length),v=new DataView(lh.buffer);w32(v,0,0x04034b50);w16(v,4,20);w32(v,14,crc);w32(v,18,size);w32(v,22,size);w16(v,26,n.length);lh.set(n,30);parts.push(lh,b);let ch=new Uint8Array(46+n.length),cv=new DataView(ch.buffer);w32(cv,0,0x02014b50);w16(cv,4,20);w16(cv,6,20);w32(cv,16,crc);w32(cv,20,size);w32(cv,24,size);w16(cv,28,n.length);w32(cv,42,offset);ch.set(n,46);central.push(ch);offset+=lh.length+size;centralSize+=ch.length}if(files.length>65535||offset>0xffffffff)throw Error('Backup exceeds standard ZIP size limits.');let e=new Uint8Array(22),v=new DataView(e.buffer);w32(v,0,0x06054b50);w16(v,8,files.length);w16(v,10,files.length);w32(v,12,centralSize);w32(v,16,offset);return new Blob([...parts,...central,e],{type:'application/zip'})}
async function exportZip(){toast('Preparing full library ZIP backup…');try{const files=[{name:'songvault-library.json',blob:new Blob([JSON.stringify({format:'songvault-v1',exportedAt:now(),songs:state.songs,albums:state.albums,playlists:state.playlists},null,2)],{type:'application/json'})}];for(const s of state.songs)for(const v of s.versions)if(v.fileName){const obj=await storeGet('audio',v.id);if(obj?.blob)files.push({name:`audio/${v.id}`,blob:obj.blob})}const zip=await buildZip(files);downloadBlob(zip,`songvault-backup-${new Date().toISOString().slice(0,10)}.zip`);toast(`Complete backup created (${files.length-1} audio files).`)}catch(e){console.error(e);toast('Backup failed: '+e.message)}}
function exportJson(){downloadBlob(new Blob([JSON.stringify({format:'songvault-v1',exportedAt:now(),songs:state.songs,albums:state.albums,playlists:state.playlists},null,2)],{type:'application/json'}),`songvault-catalog-${new Date().toISOString().slice(0,10)}.json`);toast('Metadata exported. Audio files are not included.')}
async function parseZip(file){const tailStart=Math.max(0,file.size-65557),tail=new DataView(await file.slice(tailStart).arrayBuffer());let e=-1;for(let p=tail.byteLength-22;p>=0;p--){if(tail.getUint32(p,true)===0x06054b50){e=p;break}}if(e<0)throw Error('ZIP directory not found.');const length=tail.getUint16(e+10,true),cdOffset=tail.getUint32(e+16,true),cdSize=tail.getUint32(e+12,true);let a=new Uint8Array(await file.slice(cdOffset,cdOffset+cdSize).arrayBuffer()),dv=new DataView(a.buffer),p=0,out=[];for(let i=0;i<length;i++){if(dv.getUint32(p,true)!==0x02014b50)throw Error('Invalid ZIP entry.');let method=dv.getUint16(p+10,true),size=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extra=dv.getUint16(p+30,true),comment=dv.getUint16(p+32,true),local=dv.getUint32(p+42,true),name=decoder.decode(a.slice(p+46,p+46+nameLen));if(method!==0)throw Error('Only SongVault uncompressed ZIP backups are supported.');const lh=new DataView(await file.slice(local,local+30).arrayBuffer());if(lh.getUint32(0,true)!==0x04034b50)throw Error('Invalid ZIP local entry.');let pos=local+30+lh.getUint16(26,true)+lh.getUint16(28,true);out.push({name,blob:file.slice(pos,pos+size)});p+=46+nameLen+extra+comment}return out}
async function restoreBackup(file){toast('Reading backup…');try{let manifest,entries=[];if(file.name.toLowerCase().endsWith('.json'))manifest=JSON.parse(await file.text());else{entries=await parseZip(file);const data=entries.find(x=>x.name==='songvault-library.json');if(!data)throw Error('Not a SongVault backup ZIP.');manifest=JSON.parse(await data.blob.text())}if(manifest.format!=='songvault-v1'||!Array.isArray(manifest.songs)||!Array.isArray(manifest.albums))throw Error('Unsupported backup format.');const audioIds=new Set(manifest.songs.flatMap(s=>(s.versions||[]).map(v=>v.id)));let tracks=0,audio=0;for(const a of manifest.albums){if(!a.id||typeof a.title!=='string')continue;await storePut('albums',a)}for(const p of (Array.isArray(manifest.playlists)?manifest.playlists:[])){if(!p?.id||typeof p.name!=='string'||!Array.isArray(p.songIds))continue;await storePut('playlists',{...p,songIds:p.songIds.filter(x=>typeof x==='string')})}for(const s of manifest.songs){if(!s.id||typeof s.title!=='string'||!Array.isArray(s.versions))continue;await storePut('songs',s);tracks++}for(const f of entries){if(!f.name.startsWith('audio/'))continue;const id=f.name.slice(6);if(!audioIds.has(id))continue;await storePut('audio',{id,blob:f.blob});audio++}await load();toast(`Restored ${tracks} tracks and ${audio} audio files. Existing other tracks kept.`);if(!entries.length)alert('Metadata restored. Audio files were not included in that JSON backup.');}catch(e){console.error(e);toast('Restore failed: '+e.message)}}
async function action(el){const a=el.dataset.action,id=el.dataset.id;try{if(a==='install-app'){await requestInstall()}else if(a==='protect-storage'){await protectStorage()}else if(a==='apply-update'){if(waitingWorker)waitingWorker.postMessage({type:'SKIP_WAITING'});else location.reload()}else if(a==='later-update'){$('#updateToast').classList.remove('show')}else if(a==='view'){state.view=el.dataset.view;state.filterAlbum='';state.filterGenre='';state.filterSubgenre='';state.search='';state.bulk=false;state.selected.clear();render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='new-song')songEditor();else if(a==='new-speech')songEditor(null,'speech');else if(a==='edit-song')songEditor(id);else if(a==='save-song')await saveSong();else if(a==='close-modal')closeModal();else if(a==='modal-kind'){const kind=el.dataset.kind;if(state.modalKind===kind)return;const draft=fieldsFromEditor();state.modalKind=kind;const title=draft.title;const editId=state.editId;songEditor(editId,kind);if(!editId){$('#fTitle').value=title;$('#fArtist').value=draft.artist;$('#fGenre').value=draft.genre;$('#fSubgenre').value=draft.subgenre;$('#fMood').value=draft.mood;$('#fNotes').value=draft.notes}}else if(a==='open-genre'){state.filterGenre=el.dataset.genre;state.filterSubgenre='';state.filterAlbum='';state.view='library';render()}else if(a==='open-subgenre'){state.filterGenre=el.dataset.genre;state.filterSubgenre=el.dataset.subgenre;state.filterAlbum='';state.view='library';render()}else if(a==='new-album')albumEditor();else if(a==='edit-album')albumEditor(id);else if(a==='save-album')await saveAlbum();else if(a==='open-album'){if(el.closest('[data-action="edit-album"]'))return;state.filterAlbum=id;state.view='library';render()}else if(a==='copy-prompt'){const s=state.songs.find(s=>s.id===id);if(s)await copyText(promptFor(s))}else if(a==='import-audio')$('#importAudio').click();else if(a==='play')await playSong(id);else if(a==='play-version')await playSong(id,el.dataset.version);else if(a==='stop-audio')stopAudio();else if(a==='upload-version'){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac';inp.onchange=()=>addVersion(id,inp.files[0]);inp.click()}else if(a==='activate-version'){const s=state.songs.find(s=>s.id===id);s.activeVersionId=el.dataset.version;s.updatedAt=now();await storePut('songs',s);closeModal();await load();songEditor(id);toast('Active version changed.')}else if(a==='delete-song')await delSong(id);else if(a==='delete-album')await delAlbum(id);else if(a==='delete-version')await delVersion(id,el.dataset.version);else if(a==='toggle-bulk'){state.bulk=!state.bulk;state.selected.clear();render()}else if(a==='select-song'){if(el.checked)state.selected.add(id);else state.selected.delete(id);const count=$('.bulkbar b');if(count)count.textContent=state.selected.size+' selected'}else if(a==='apply-bulk')await applyBulk();else if(a==='sample')await addSample();else if(a==='export-zip')await exportZip();else if(a==='export-json')exportJson();else if(a==='import-backup')$('#importBackup').click()}catch(e){console.error(e);toast('Error: '+e.message)}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button){if(button.dataset.action!=='select-song')e.preventDefault();action(button)}});document.addEventListener('change',e=>{if(e.target.id==='genreFilter'){state.filterGenre=e.target.value;state.filterSubgenre='';render()}else if(e.target.id==='subgenreFilter'){state.filterSubgenre=e.target.value;render()}else if(e.target.id==='albumFilter'){state.filterAlbum=e.target.value;render()}else if(e.target.id==='sortFilter'){state.sort=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='query'){state.search=e.target.value;const start=e.target.selectionStart,end=e.target.selectionEnd;render();const q=$('#query');q?.focus();q?.setSelectionRange(start,end)}});$('#importAudio').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';await importAudio(files)});$('#importBackup').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(file&&confirm('Restore this backup into the current library? Matching song IDs will be updated; other songs will remain.'))await restoreBackup(file)});$('#shade').addEventListener('click',e=>{if(e.target.id==='shade')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#shade').classList.contains('open'))closeModal()});
(async()=>{try{state.db=await idb();await load()}catch(e){console.error(e);$('#content').innerHTML=`<div class="empty"><h2>Browser storage unavailable</h2><p>SongVault requires IndexedDB. Try a normal browser tab on a stable HTTPS website rather than an incognito or restricted file preview.</p><p class="smallprint">${escapeHTML(e.message)}</p></div>`;toast('Storage unavailable; see message.')}})();
async function requestInstall(){if(isStandalone())return toast('SongVault Studio is already running as an installed app.');if(deferredInstallPrompt){const prompt=deferredInstallPrompt;deferredInstallPrompt=null;await prompt.prompt();try{const choice=await prompt.userChoice;toast(choice.outcome==='accepted'?'Install requested.':'You can install later from the browser menu.')}catch{}return;}modal('Install SongVault Studio',`<div class="install-panel"><h3>Android Chrome</h3><p>Visit your hosted SongVault website using HTTPS, tap the three-dot browser menu, then choose <b>Install app</b> or <b>Add to Home screen</b>. If you don't see it yet, reload after first opening the website.</p><h3>Windows Chrome / Edge</h3><p>Open the hosted website, use the install icon in the address bar or browser menu → <b>Install app</b>.</p><h3>Important</h3><p>Song/audio data stays on this one browser/device. Use <b>Backup → Download full backup</b> before changing devices, URLs, or clearing browser data.</p></div>`,`<button class="btn primary" data-action="close-modal">Understood</button>`)}
async function protectStorage(){try{if(!navigator.storage?.persist)return toast('This browser does not expose persistent storage controls.');const ok=await navigator.storage.persist();toast(ok?'Browser granted persistent storage (still keep backups).':'Browser did not grant persistent storage. Back up regularly.')}catch(e){toast('Persistent storage request unavailable: '+e.message)}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;toast('SongVault installed. Your library remains on this device.')});
window.addEventListener('online',()=>{const el=$('#connectionStatus');if(el)el.textContent='● Online'});
window.addEventListener('offline',()=>{const el=$('#connectionStatus');if(el)el.textContent='● Offline-ready'});
if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol)){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    function showUpdate(){if(navigator.serviceWorker.controller&&reg.waiting){waitingWorker=reg.waiting;$('#updateToast').classList.add('show')}}
    showUpdate();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')showUpdate()})});
  }).catch(e=>console.warn('Offline cache not available',e));
}
